# Based on origin/robot_localization:src/amr_localization/amr_localization_launch/params/ekf.yaml.
# Changes: imu0 /new_imu_data -> /imu/fixed (bag IMU restamped, bias removed, covariances filled),
# imu0 uses only vyaw (two_d_mode), use_control false, frequency 10 -> 50 Hz and
# imu0_queue_size 5 -> 100 (at 10 Hz / queue 5 most of the 400 Hz IMU would be dropped).
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    odom_frame: odom_frame
    base_link_frame: Base_Link
    world_frame: odom_frame
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: true
    imu0: /imu/fixed
