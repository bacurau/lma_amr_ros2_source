%YAML 1.2
---
launch:
  - node:
      pkg: "amr_serial"
      exec: "reset_arm"
      name: "reset_arm"
      output: "screen"

  - node:
      pkg: "micro_ros_agent"
      exec: "micro_ros_agent"
      name: "micro_ros_agent"
      output: "screen"
      args: "serial --dev /dev/ttyACM0 -b 1500000"
